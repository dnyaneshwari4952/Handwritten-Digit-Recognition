name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Validate Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify CLI Commands
        run: |
          python -m src.cli system-info
          python -m src.cli evaluate

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/ --durations=10

      - name: Verify Streamlit App Syntax
        run: |
          python -c "import streamlit_app; print('Streamlit root module verified successfully!')"
          python -c "from app.streamlit_app import get_predictor; print('Streamlit app predictor verified successfully!')"

      - name: Verify FastAPI Microservice
        run: |
          python -c "from api.app import app; print('FastAPI microservice initialized successfully!')"
