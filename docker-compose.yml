services:
  streamlit-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mnist-streamlit-studio
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
      - TF_ENABLE_ONEDNN_OPTS=0
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  fastapi-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mnist-fastapi-service
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
      - TF_ENABLE_ONEDNN_OPTS=0
    restart: unless-stopped
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
