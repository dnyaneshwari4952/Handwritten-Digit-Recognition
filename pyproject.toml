[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-digit-recognition"
version = "1.0.0"
description = "Production-Grade Deep Learning Vision System for Handwritten Digit Recognition with Streamlit Studio, CLI, and FastAPI"
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = { text = "MIT" }
authors = [
    { name = "Deep Learning Engineer" }
]
keywords = [
    "mnist",
    "deep-learning",
    "computer-vision",
    "cnn",
    "tensorflow",
    "keras",
    "streamlit",
    "fastapi"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "tensorflow-cpu>=2.16.0; sys_platform != 'darwin'",
    "tensorflow>=2.16.0; sys_platform == 'darwin'",
    "keras>=3.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.35.0",
    "streamlit-drawable-canvas>=0.9.3",
    "requests>=2.31.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0"
]

[project.scripts]
mnist-cli = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "api*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']
